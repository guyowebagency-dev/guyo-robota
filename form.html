<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualification Form | NextRise Web Design</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg: #000000;
            --primary: #FFFFFF;
            --accent: #00FF00;
            --card-bg: #1A1A1A;
            --muted: #666666;
            --light-grey: #CCCCCC;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px), 
                              linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            color: var(--primary);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Global Nav */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            padding: 0 40px;
            backdrop-filter: blur(20px);
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            z-index: 1000;
        }

        .nav-logo {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .nav-logo h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 18px;
            color: white;
        }

        .nav-logo span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 0.15em;
        }

        /* Global Green Orb */
        .orb {
            position: fixed;
            top: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0,255,0,0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Fade Up Animation */
        .fade-up {
            opacity: 0;
            transform: translateY(24px);
            animation: fadeUp 0.6s ease forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 48px;
            position: relative;
            z-index: 10;
        }

        .step-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s;
        }

        .circle.inactive { border: 2px solid #333; color: #555; background: transparent; }
        .circle.active { border: 2px solid var(--accent); color: var(--accent); background: rgba(0,255,0,0.1); box-shadow: 0 0 12px rgba(0,255,0,0.3); }
        .circle.complete { background: var(--accent); color: #000; border: 2px solid var(--accent); }

        .line { width: 64px; height: 2px; background: #222; margin: 0 0px; }
        .line.complete { background: var(--accent); }

        .step-label {
            position: absolute;
            top: 44px;
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #555;
        }

        .step-wrapper.active .step-label { color: var(--accent); }

        /* Content Wrapper */
        .content-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 24px 80px;
            position: relative;
            z-index: 10;
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 12px;
        }

        .headline {
            font-family: 'Archivo Black', sans-serif;
            font-size: 38px;
            color: white;
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .subtext {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Form Fields */
        .field-wrapper { margin-bottom: 22px; position: relative; }

        label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            color: var(--light-grey);
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            color: #FFFFFF;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,255,0,0.1);
        }

        input::placeholder, textarea::placeholder { color: #444; }

        /* Custom Select */
        .select-wrapper { position: relative; }
        select { appearance: none; cursor: pointer; }
        .select-wrapper::after {
            content: '';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 6px;
            background-color: var(--accent);
            clip-path: polygon(100% 0%, 0 0%, 50% 100%);
            pointer-events: none;
        }

        /* Revenue Grid */
        .revenue-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .revenue-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 14px 18px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            color: #CCCCCC;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .revenue-card:hover { border-color: rgba(255,255,255,0.2); }
        .revenue-card input { display: none; }
        .revenue-card.selected {
            border-color: var(--accent);
            background: rgba(0,255,0,0.07);
            color: #FFFFFF;
        }

        .revenue-card.full-width { grid-column: 1 / -1; justify-content: center; }

        .revenue-card .checkmark { display: none; color: var(--accent); font-weight: bold; }
        .revenue-card.selected .checkmark { display: block; }

        .revenue-card.full-width { grid-column: 1 / -1; justify-content: center; }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            margin-top: 8px;
            background: var(--accent);
            color: #000;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 800;
            padding: 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            box-shadow: 0 0 40px rgba(0,255,0,0.4);
            transform: translateY(-2px);
        }

        .error-msg {
            color: #FF4444;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .trust-line {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            color: #555;
            text-align: center;
            margin-top: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .headline { font-size: 28px; }
            .nav { padding: 0 20px; }
        }

        @media (max-width: 600px) {
            .revenue-grid { grid-template-columns: 1fr; }
            .circle { width: 28px; height: 28px; font-size: 11px; }
            .line { width: 40px; }
            .step-label { top: 36px; font-size: 9px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" style="height: 40px; width: auto;">
              <!-- Main Text -->
              <text x="450" y="110"
                    text-anchor="middle"
                    font-family="Arial, Helvetica, sans-serif"
                    font-size="110"
                    font-weight="700"
                    font-style="italic"
                    fill="white">
                NEXTRISE
              </text>

              <!-- Rounded Button -->
              <rect x="250" y="150"
                    rx="35"
                    ry="35"
                    width="400"
                    height="70"
                    fill="none"
                    stroke="white"
                    stroke-width="4"/>

              <!-- WEB DESIGN text -->
              <text x="400" y="195"
                    text-anchor="middle"
                    font-family="Arial, Helvetica, sans-serif"
                    font-size="38"
                    font-weight="700"
                    font-style="italic"
                    fill="white">
                WEB DESIGN
              </text>

              <!-- Globe icon -->
              <circle cx="600" cy="185" r="20"
                      fill="none"
                      stroke="white"
                      stroke-width="3"/>

              <line x1="580" y1="185" x2="620" y2="185"
                    stroke="white"
                    stroke-width="2"/>

              <line x1="600" y1="165" x2="600" y2="205"
                    stroke="white"
                    stroke-width="2"/>

              <!-- Cursor -->
              <polygon points="620,200 650,215 635,220"
                       fill="white"/>
            </svg>
        </div>
    </nav>

    <div class="orb"></div>

    <div class="progress-container fade-up">
        <div class="step-wrapper active">
            <div class="circle active">1</div>
            <div class="step-label">YOUR INFO</div>
        </div>
        <div class="line"></div>
        <div class="step-wrapper">
            <div class="circle inactive">2</div>
            <div class="step-label">REVIEW</div>
        </div>
        <div class="line"></div>
        <div class="step-wrapper">
            <div class="circle inactive">3</div>
            <div class="step-label">BOOK CALL</div>
        </div>
    </div>

    <div class="content-wrapper fade-up" style="animation-delay: 0.1s;">
        <p class="section-label">QUALIFICATION FORM</p>
        <h2 class="headline">Tell Us About Your Business</h2>
        <p class="subtext">This takes 2 minutes. We use this to make sure we can actually help you before we speak.</p>

        <form id="qualForm">
            <div class="field-wrapper">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="Full Name" required>
            </div>

            <div class="field-wrapper">
                <label>Business Name *</label>
                <input type="text" id="businessName" placeholder="Business Name" required>
            </div>

            <div class="field-wrapper">
                <label>Industry *</label>
                <input type="text" id="industry" placeholder="e.g. Tourism, Real Estate, Construction..." required>
            </div>

            <div class="field-wrapper">
                <label>Phone Number *</label>
                <input type="tel" id="phone" placeholder="+254 7XX XXX XXX" required>
            </div>

            <div class="field-wrapper">
                <label>What's your average monthly revenue? *</label>
                <div class="revenue-grid">
                    <label class="revenue-card">
                        <input type="radio" name="revenue" value="Under KES 50,000" required>
                        <span>Under KES 50,000</span>
                        <span class="checkmark">✓</span>
                    </label>
                    <label class="revenue-card">
                        <input type="radio" name="revenue" value="KES 50,000 – 150,000">
                        <span>KES 50,000 – 150,000</span>
                        <span class="checkmark">✓</span>
                    </label>
                    <label class="revenue-card">
                        <input type="radio" name="revenue" value="KES 150,000 – 500,000">
                        <span>KES 150,000 – 500,000</span>
                        <span class="checkmark">✓</span>
                    </label>
                    <label class="revenue-card">
                        <input type="radio" name="revenue" value="KES 500,000+">
                        <span>KES 500,000+</span>
                        <span class="checkmark">✓</span>
                    </label>
                    <label class="revenue-card full-width">
                        <input type="radio" name="revenue" value="Prefer not to say">
                        <span>Prefer not to say</span>
                        <span class="checkmark" style="margin-left: 10px;">✓</span>
                    </label>
                </div>
            </div>

            <div class="field-wrapper">
                <label>What's your biggest challenge right now? (Optional)</label>
                <textarea id="challenge" rows="4" placeholder="e.g. I struggle to get new clients online, my competitors have better websites..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Analyse My Business →</button>
            <p class="trust-line">🔒 Your information is private and never shared.</p>
        </form>
    </div>

    <script>
        // Revenue Card Selection Styling
        const cards = document.querySelectorAll('.revenue-card');
        cards.forEach(card => {
            const input = card.querySelector('input');
            card.addEventListener('click', () => {
                cards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                input.checked = true;
            });
        });

        const form = document.getElementById('qualForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const params = new URLSearchParams({
                name: document.getElementById('fullName').value,
                business: document.getElementById('businessName').value,
                industry: document.getElementById('industry').value,
                phone: document.getElementById('phone').value,
                revenue: document.querySelector('input[name="revenue"]:checked').value,
                challenge: document.getElementById('challenge').value
            });
            // Passes data to the next step via URL parameters
            window.location.href = `qualification.html?${params.toString()}`;
        });
    </script>
</body>
</html>
